name: Deploy
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-deploy-to-T:
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: |
          echo "Totally building the app"
          echo "building..."
          echo "building..."
          echo "Build complete"
      - name: deploy
        run: |
          echo "Totally deploying the app to test environment"
          echo "deploying..."
          echo "deploying..."
          echo "Deploy complete"
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 5
  deploy-to-production:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: yeet
        run: |
          echo "¡Vámonos!"
          echo "deploying..."
          echo "deploying..."
          echo "Deployed to production"